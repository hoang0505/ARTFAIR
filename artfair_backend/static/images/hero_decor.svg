<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Soft gradients -->
    <linearGradient id="petalPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9EBE" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#E85A88" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#C52A70" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="petalLavender" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.65"/>
    </linearGradient>

    <linearGradient id="stemGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.7"/>
    </linearGradient>

    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE4E6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F3E8FF" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Light Aura -->
  <circle cx="230" cy="150" r="130" fill="url(#auraGlow)"/>

  <!-- Golden Stems and Delicate Vine -->
  <path d="M 120 280 C 160 210, 200 180, 240 130 C 260 100, 290 80, 340 70" fill="none" stroke="url(#stemGold)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 180 260 C 210 200, 250 170, 310 160" fill="none" stroke="url(#stemGold)" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>

  <!-- Lotus & Peony Petals Group 1 (Left & Background) -->
  <g transform="translate(180, 110) rotate(-15)" filter="url(#softGlow)" opacity="0.85">
    <ellipse cx="0" cy="0" rx="42" ry="75" fill="url(#petalLavender)" transform="rotate(-35)"/>
    <ellipse cx="25" cy="-10" rx="38" ry="70" fill="url(#petalLavender)" transform="rotate(25)"/>
  </g>

  <!-- Central Lotus Blossom -->
  <g transform="translate(240, 140)">
    <!-- Back Petals -->
    <path d="M 0 0 C -45 -50, -35 -110, 0 -130 C 35 -110, 45 -50, 0 0 Z" fill="url(#petalLavender)" opacity="0.7"/>
    <path d="M -20 -10 C -70 -50, -80 -100, -35 -125 C -5 -90, 0 -40, -20 -10 Z" fill="url(#petalPink)" opacity="0.85"/>
    <path d="M 20 -10 C 70 -50, 80 -100, 35 -125 C 5 -90, 0 -40, 20 -10 Z" fill="url(#petalPink)" opacity="0.85"/>

    <!-- Mid Petals -->
    <path d="M -15 -5 C -55 -40, -60 -85, -20 -105 C 5 -75, 10 -30, -15 -5 Z" fill="url(#petalPink)" opacity="0.95"/>
    <path d="M 15 -5 C 55 -40, 60 -85, 20 -105 C -5 -75, -10 -30, 15 -5 Z" fill="url(#petalPink)" opacity="0.95"/>
    
    <!-- Central Core Petal -->
    <path d="M 0 0 C -30 -35, -20 -95, 0 -115 C 20 -95, 30 -35, 0 0 Z" fill="url(#petalPink)"/>
    
    <!-- Golden Pollen Dust -->
    <circle cx="0" cy="-55" r="4.5" fill="#FDE68A"/>
    <circle cx="-12" cy="-45" r="3.5" fill="#FDE68A"/>
    <circle cx="12" cy="-45" r="3.5" fill="#FDE68A"/>
    <circle cx="-6" cy="-68" r="3" fill="#FDE68A"/>
    <circle cx="7" cy="-68" r="3" fill="#FDE68A"/>
  </g>

  <!-- Floating Petals & Light Sparkles -->
  <g opacity="0.8">
    <path d="M 90 120 C 75 100, 80 80, 100 85 C 115 95, 110 115, 90 120 Z" fill="url(#petalPink)" transform="rotate(20 90 120)"/>
    <path d="M 320 190 C 305 175, 310 160, 330 165 C 345 175, 340 190, 320 190 Z" fill="url(#petalLavender)" transform="rotate(-30 320 190)"/>
    <circle cx="140" cy="70" r="3.5" fill="#FDE68A" opacity="0.8"/>
    <circle cx="280" cy="60" r="4" fill="#FDE68A" opacity="0.9"/>
    <circle cx="340" cy="120" r="2.5" fill="#FDE68A" opacity="0.7"/>
    <circle cx="160" cy="180" r="3" fill="#FDE68A" opacity="0.6"/>
    <circle cx="290" cy="230" r="4.5" fill="#FDE68A" opacity="0.85"/>
  </g>
</svg>
